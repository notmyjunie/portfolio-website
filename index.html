<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | M3 Expressive</title>
  <!-- Dynamic Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <main id="app"
    style="background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); min-height: 100vh; padding: 2rem;">

    <!-- Expressive Hero Badge -->
    <span
      style="background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); padding: 0.5rem 1rem; border-radius: 999px; font-weight: 600; font-size: 0.875rem;">
      Available for Hire
    </span>

    <!-- Display Title -->
    <h1 style="font-family: var(--font-display); font-size: 3.5rem; font-weight: 800; margin-top: 1rem;">
      Creative Developer & Designer
    </h1>

    <!-- M3 Web Button -->
    <md-filled-button style="--md-filled-button-container-color: var(--md-sys-color-primary);">
      Explore Work
    </md-filled-button>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
